name: Notice Monitor

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force monitoring execution'
        required: false
        default: 'true'

# Prevent concurrent runs from reading stale state or sending duplicate alerts
concurrency:
  group: notice-monitor-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Check Official Websites & Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Notice Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/monitor.py --config config/websites.json --state state/notices.json

      - name: Commit and Push State Updates Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if state/notices.json actually changed
          if ! git diff --quiet state/notices.json; then
            echo "State file modified. Preparing commit..."
            cp state/notices.json /tmp/local_notices_state.json
            git add state/notices.json
            git commit -m "chore(state): update notice monitor state [skip ci]"
            
            # Retry loop with union-merge state protection to never overwrite newer remote state
            max_retries=3
            for i in $(seq 1 $max_retries); do
              echo "Push attempt $i of $max_retries..."
              if git push origin HEAD; then
                echo "State pushed successfully."
                exit 0
              fi
              echo "Remote advanced. Fetching latest origin/main and union-merging state/notices.json..."
              git fetch origin main
              git reset --hard origin/main
              python src/monitor.py --merge-state state/notices.json /tmp/local_notices_state.json state/notices.json
              if ! git diff --quiet state/notices.json; then
                git add state/notices.json
                git commit -m "chore(state): update notice monitor state [skip ci]"
              else
                echo "Remote already contains all state updates."
                exit 0
              fi
              sleep 2
            done
            echo "Failed to push state after $max_retries attempts."
            exit 1
          else
            echo "No state changes detected. Skipping git commit."
          fi
